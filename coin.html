<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLL COIN Showcase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0f24; /* कॉइन के लिए शानदार डार्क बैकग्राउंड */
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            color: #fff;
        }

        /* आपकी पहली इमेज वाला हूबहू CSS स्टाइल */
        .title {
            position: fixed;
            top: 52px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 2px;
            opacity: .85;
            text-align: center;
            z-index: 10;
        }

        .hint {
            position: fixed;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            opacity: 0.6;
            text-align: center;
            width: 100%;
            z-index: 10;
        }

        /* कॉइन का स्टेज और चमक (Glow) */
        .stage {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(26, 78, 255, 0.4) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
        }

        /* वापस जाने का बटन */
        .back-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            text-decoration: none;
            font-size: 14px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="title">LLL COIN</div>
    <div class="hint">Drag to rotate • or press Auto-Spin</div>

    <div class="stage">
        <div class="glow"></div>
        
        <!-- यहाँ आपका कॉइन का एनीमेशन आएगा -->
        <div class="coin" id="coin">
            <!-- ⚠️ याद रखें: जब आप इसे सेव कर लें, तो अपनी पुरानी फाइल की वो 17,025 अक्षरों वाली लंबी लाइन यहाँ इस डिब्बे के अंदर पेस्ट कर दीजिएगा -->
        </div>
    </div>

    <!-- वापस डैशबोर्ड (वेलकम पेज) पर जाने का लिंक -->
    <a href="welcome.html" class="back-btn">← Back to Dashboard</a>

</body>
</html>
