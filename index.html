<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LLL Coin — 360° Viewer</title>
<style>
  :root{
    --gold:#f2c14e;
    --gold-dark:#8a6a1f;
    --bg:#05060a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(242,193,78,0.08), transparent 60%),
      var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-family:'Segoe UI',Roboto,sans-serif;
    -webkit-user-select:none;
    user-select:none;
    touch-action:none;
  }
  .stage{
    position:relative;
    width:min(78vw,520px);
    height:min(78vw,520px);
    perspective:1400px;
  }
  .coin{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transform:rotateY(0deg) rotateX(6deg);
    cursor:grab;
    will-change:transform;
  }
  .coin.grabbing{cursor:grabbing;}

  .face{
    position:absolute;
    inset:0;
    border-radius:50%;
    backface-visibility:hidden;
    overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
  }
  .face img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .face.front{ transform:translateZ(9px); }
  .face.back{ transform:rotateY(180deg) translateZ(9px); }

  /* cylindrical edge built from thin slices */
  .edge{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
  }
  .edge div{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    border-radius:50%;
    box-shadow:0 0 0 9px rgba(0,0,0,0);
  }

  .rim{
    position:absolute;
    inset:0;
    border-radius:50%;
    transform-style:preserve-3d;
  }

  .glow{
    position:absolute;
    inset:-15%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(242,193,78,0.18), transparent 70%);
    filter:blur(20px);
    z-index:-1;
    animation:pulse 4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.5; transform:scale(1);}
    50%{opacity:.9; transform:scale(1.06);}
  }

  .controls{
    position:fixed;
    bottom:26px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    align-items:center;
  }
  .btn{
    background:linear-gradient(135deg,#2a2410,#0d0b06);
    border:1px solid var(--gold-dark);
    color:var(--gold);
    padding:10px 18px;
    border-radius:30px;
    font-size:13px;
    letter-spacing:.5px;
    cursor:pointer;
    transition:all .2s ease;
  }
  .btn:hover{
    background:linear-gradient(135deg,#3a3010,#141005);
    box-shadow:0 0 14px rgba(242,193,78,0.35);
  }
  .btn.active{
    background:linear-gradient(135deg,var(--gold),#c99a2e);
    color:#161200;
    border-color:var(--gold);
  }

  .hint{
    position:fixed;
    top:22px;
    left:50%;
    transform:translateX(-50%);
    color:rgba(242,193,78,0.65);
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
  }

  .title{
    position:fixed;
    top:52px;
    left:50%;
    transform:translateX(-50%);
    color:#fff;
    font-size:15px;
    font-weight:600;
    letter-spacing:2px;
    opacity:.85;
  }
</style>
</head>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Login Form</title>
    
    <!-- यहाँ CSS (स्टाइल और एनिमेशन) का कोड है -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4a75ff, #1a4eff);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* फॉर्म का डिब्बा और उसका तैरता हुआ एनिमेशन */
        .form-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
            opacity: 0;
            transform: translateY(50px);
            animation: fadeInUp 1s ease-out forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            color: #1a4eff;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #333;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #00c853;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- लॉगिन फॉर्म का हिस्सा -->
    <div class="wrapper">
        <div class="form-container">
            <h2>Register now</h2>
            <p class="subtitle">Secure your spot in our upcoming live webinar</p>
            
            <form id="registrationForm">
                <div class="input-group">
                    <label>What's your name? *</label>
                    <input type="text" id="userName" placeholder="Name" required>
                </div>
                
                <div class="input-group">
                    <input type="text" placeholder="Surname" required>
                </div>
                
                <div class="input-group">
                    <label>Enter your email address *</label>
                    <input type="email" placeholder="example@company.com" required>
                </div>
                
                <button type="submit" class="btn">Next</button>
            </form>
        </div>
    </div>

    <!-- यहाँ वही JavaScript कोड है जो इमेज में दिख रहा है, जिसे <script> टैग के अंदर रखा गया है -->
    <script>
        document.getElementById('registrationForm').addEventListener('submit', function(event) {
            event.preventDefault(); 
            
            // यूजर का नाम निकालकर सेव करना
            const inputName = document.getElementById('userName').value;
            localStorage.setItem('savedName', inputName);
            
            // अगले पेज पर जाने के लिए
            window.location.href = "welcome.html"; 
        });
    </script>
</body>
</html>
